name: scheduler

# External scheduler (AGENTS §13: no in-process timers). GitHub cron is best-effort with a 5-minute floor,
# which is adequate for the academic demo; every job is idempotent so late or duplicate runs are safe.
# Required repository secrets: APP_URL (e.g. https://demo.example.com, no trailing slash) and SCHEDULER_SECRET.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SCHEDULER_SECRET" ]; then
            echo "APP_URL or SCHEDULER_SECRET not configured; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Call internal jobs
        if: steps.cfg.outputs.skip != 'true'
        run: |
          status=0
          for job in expire-orders dispatch-notifications send-event-reminders reconcile-ticket-issuance; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 -X POST \
              -H "x-scheduler-secret: $SCHEDULER_SECRET" -H "content-type: application/json" -d '{}' \
              "$APP_URL/api/internal/jobs/$job") || code=000
            echo "$job -> $code"
            if [ "$code" != "200" ]; then status=1; fi
          done
          exit $status
