name: ci

on:
  push:
  pull_request:

env:
  NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3000
  ALLOW_PARTIAL_ENV: "true"
  EMAIL_PROVIDER: sandbox
  TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/verify-migrations.ts
      - run: npx tsx scripts/secret-scan.ts
      - run: npx tsx scripts/verify-env.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Integration tests (Neon test branch)
        if: env.TEST_DATABASE_URL != ''
        run: npm run test:integration
      - name: E2E
        run: npm run test:e2e
        env:
          # Test-only values; the database is the isolated Neon test branch, never production.
          APP_ENV: test
          WEB_ORIGIN: http://127.0.0.1:3000
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
          QR_ENCRYPTION_KEYS: ci-only-qr-key-0123456789abcdef0123
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL }}
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
