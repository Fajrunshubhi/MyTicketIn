name: rollback

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Prior artifact digest (git SHA)
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        env:
          ROLLBACK_ARTIFACT_DIGEST: ${{ inputs.digest }}
      - run: npx tsx scripts/rollback-verify.ts
        env:
          ROLLBACK_ARTIFACT_DIGEST: ${{ inputs.digest }}
