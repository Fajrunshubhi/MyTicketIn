services:
  postgres:
    image: postgres:18-alpine
    container_name: myticketin-postgres
    environment:
      POSTGRES_USER: myticketin
      POSTGRES_PASSWORD: myticketin_dev
      POSTGRES_DB: myticketin
    ports:
      - "5432:5432"
    volumes:
      - myticketin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myticketin -d myticketin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  myticketin_pgdata:
